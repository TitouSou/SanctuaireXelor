# Publie le dossier site/ sur GitHub Pages à chaque push sur main.
# Dans le dépôt GitHub : Settings > Pages > Source = « GitHub Actions ».
name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests de non-régression
        run: |
          node outils/test_reference.mjs
          node outils/test_donnees.mjs
          node moteur/tests/test_portage.mjs
          node moteur/tests/test_moteur.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
